{% extends "base.html" %}

{% block titulo %}
    Editar disciplina
{% endblock %}

{% block conteudo %}

<section class="pagina-interna pagina-disciplina">

    <div class="container-pagina conteudo-formulario">

        <div class="breadcrumb">
            <a href="/dashboard">Dashboard</a>
            <span>/</span>
            <strong>Editar disciplina</strong>
        </div>

        <header class="cabecalho-pagina">
            <h1>Editar disciplina</h1>
            <p>
                Atualize as informações da disciplina e salve as alterações.
            </p>
        </header>

        <form class="formulario-padrao" method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="campo-padrao">
                <label for="nome">Nome da disciplina</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ disciplina.nome }}"
                    maxlength="100"
                    required
                >
            </div>

            <div class="campo-padrao">
                <label for="professor">Professor</label>
                <input
                    type="text"
                    id="professor"
                    name="professor"
                    value="{{ disciplina.professor or '' }}"
                    maxlength="100"
                >
            </div>

            <div class="campo-padrao">
                <label for="dias_semana">Dias da semana</label>
                <input
                    type="text"
                    id="dias_semana"
                    name="dias_semana"
                    value="{{ disciplina.dias_semana }}"
                    maxlength="100"
                    required
                >
            </div>

            <div class="campo-padrao">

                <label for="limite_faltas">Limite de faltas</label>

                <div class="controle-numero">

                    <input
                        type="number"
                        id="limite_faltas"
                        name="limite_faltas"
                        value="{{ disciplina.limite_faltas }}"
                        min="1"
                        step="1"
                        inputmode="numeric"
                        required
                    >

                    <div class="botoes-numero">

                        <button
                            class="botao-quantidade"
                            type="button"
                            data-alteracao="-1"
                            aria-label="Diminuir limite de faltas"
                        >
                            −
                        </button>

                        <button
                            class="botao-quantidade"
                            type="button"
                            data-alteracao="1"
                            aria-label="Aumentar limite de faltas"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>

            <div class="acoes-formulario">
                <button class="botao-primario" type="submit">
                    Salvar alterações
                </button>

                <a class="botao-secundario" href="/dashboard">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</section>

{% endblock %}

{% block scripts %}

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const campo = document.getElementById("limite_faltas");
        const botoes = document.querySelectorAll("[data-alteracao]");

        botoes.forEach(function (botao) {
            botao.addEventListener("click", function () {
                const alteracao = Number(botao.dataset.alteracao);
                const minimo = Number(campo.min) || 1;
                const valorAtual = Number(campo.value) || minimo;

                campo.value = Math.max(minimo, valorAtual + alteracao);
            });
        });

        campo.addEventListener("blur", function () {
            const minimo = Number(campo.min) || 1;

            if (campo.value === "" || Number(campo.value) < minimo) {
                campo.value = minimo;
            }
        });
    });
</script>

{% endblock %}
