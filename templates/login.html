{% extends "base.html" %}

{% block titulo %}
    Entrar
{% endblock %}

{% block cabecalho %}{% endblock %}
{% block rodape %}{% endblock %}

{% block conteudo %}

<section class="pagina-autenticacao">

    <div class="cartao-autenticacao">

        <div class="cabecalho-autenticacao">

            <div class="logo-autenticacao">
                <img
                    src="{{ url_for('static', filename='assets/logo_minhasfaltas.svg') }}"
                    alt="Logo Minhas Faltas"
                >
            </div>

            <h1>Entrar na sua conta</h1>

            <p>
                Acesse suas disciplinas e acompanhe suas faltas.
            </p>

        </div>

        <form
            class="form-autenticacao"
            method="POST"
            action="{{ url_for('auth.login') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="grupo-campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemplo@email.com"
                    maxlength="120"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="grupo-campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                class="botao-principal"
                type="submit"
            >
                Entrar
            </button>

        </form>

        <div class="rodape-autenticacao">

            <p>
                Ainda não possui uma conta?

                <a href="{{ url_for('auth.cadastro') }}">
                    Cadastre-se
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
