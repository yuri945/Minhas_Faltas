<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
</head>

<body>

    <h1>Cadastro</h1>

    <form method="POST">

        <label>Nome</label><br>
        <input type="text" name="nome"><br><br>

        <label>Email</label><br>
        <input type="email" name="email"><br><br>

        <label>Senha</label><br>
        <input type="password" name="senha"><br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

</body>

</html>
