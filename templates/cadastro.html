<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro</title>
</head>

<body>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
            {% for categoria, mensagem in mensagens %}
                <p class="{{ categoria }}">
                    {{ mensagem }}
                </p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h1>Criar conta</h1>

    <form method="POST" action="/cadastro">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div>
            <label for="nome">Nome</label>

            <br>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                minlength="2"
                maxlength="100"
                autocomplete="name"
                required
            >
        </div>

        <br>

        <div>
            <label for="email">E-mail</label>

            <br>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                maxlength="120"
                autocomplete="email"
                required
            >
        </div>

        <br>

        <div>
            <label for="senha">Senha</label>

            <br>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Use pelo menos 6 caracteres"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <br>

    <p>
        Já possui uma conta?

        <a href="/login">
            Entrar
        </a>
    </p>

</body>

</html>
