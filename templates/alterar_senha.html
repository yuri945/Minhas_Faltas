{% extends "base.html" %}

{% block titulo %}
    Alterar senha
{% endblock %}

{% block conteudo %}

<section class="pagina-interna pagina-alterar-senha">

    <div class="container-pagina conteudo-formulario conteudo-formulario-estreito">

        <header class="cabecalho-pagina">
            <h1>Alterar senha</h1>
            <p>
                Informe sua senha atual e escolha uma nova senha com pelo menos seis caracteres.
            </p>
        </header>

        <form
            class="formulario-padrao"
            method="POST"
            action="/alterar-senha"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <div class="campo-padrao">
                <label for="senha_atual">Senha atual</label>
                <input
                    type="password"
                    id="senha_atual"
                    name="senha_atual"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="campo-padrao">
                <label for="nova_senha">Nova senha</label>
                <input
                    type="password"
                    id="nova_senha"
                    name="nova_senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
                <small>Use pelo menos seis caracteres.</small>
            </div>

            <div class="campo-padrao">
                <label for="confirmar_senha">Confirmar nova senha</label>
                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="acoes-formulario">
                <button class="botao-primario" type="submit">
                    Alterar senha
                </button>

                <a class="botao-secundario" href="/dashboard">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</section>

{% endblock %}
