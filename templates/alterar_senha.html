<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alterar senha</title>
</head>

<body>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
            {% for categoria, mensagem in mensagens %}
                <p class="{{ categoria }}">
                    {{ mensagem }}
                </p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h1>Alterar senha</h1>

    <form method="POST" action="/alterar-senha">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div>
            <label for="senha_atual">
                Senha atual
            </label>

            <br>

            <input
                type="password"
                id="senha_atual"
                name="senha_atual"
                autocomplete="current-password"
                required
            >
        </div>

        <br>

        <div>
            <label for="nova_senha">
                Nova senha
            </label>

            <br>

            <input
                type="password"
                id="nova_senha"
                name="nova_senha"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <br>

        <div>
            <label for="confirmar_senha">
                Confirmar nova senha
            </label>

            <br>

            <input
                type="password"
                id="confirmar_senha"
                name="confirmar_senha"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Alterar senha
        </button>

    </form>

    <br>

    <a href="/dashboard">
        Voltar
    </a>

</body>

</html>
